<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术峰会追踪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1115;
  --bg2:#151a21;
  --card:#171c24;
  --card-hover:#1b212c;
  --border:#242b36;
  --text:#e6e9ef;
  --text2:#9aa5b1;
  --text3:#6b7684;
  --accent:#3b82f6;
  --accent-glow:rgba(59,130,246,.25);
  --ai:#a855f7;--ai-bg:rgba(168,85,247,.16);
  --cloud:#38bdf8;--cloud-bg:rgba(56,189,248,.16);
  --dev:#34d399;--dev-bg:rgba(52,211,153,.16);
  --hw:#fb923c;--hw-bg:rgba(251,146,60,.16);
  --misc:#94a3b8;--misc-bg:rgba(148,163,184,.16);
  --ok:#34d399;--ok-bg:rgba(52,211,153,.18);
  --soon:#38bdf8;--soon-bg:rgba(56,189,248,.18);
  --end:#64748b;--end-bg:rgba(100,116,139,.14);
  --radius:12px;
  --shadow:0 2px 8px rgba(0,0,0,.3);
  --shadow-hover:0 12px 28px var(--accent-glow),0 4px 10px rgba(0,0,0,.35);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}

/* 顶部 */
.header{position:sticky;top:0;z-index:100;background:rgba(15,17,21,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1200px;margin:0 auto;padding:16px 20px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px var(--accent-glow)}
.brand .logo svg{width:22px;height:22px;color:#fff}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.02em}
.brand .sub{font-size:12px;color:var(--text3);margin-top:2px}
.sub-now{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)}
.sub-now .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.btn-refresh{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-refresh:hover{color:var(--text);border-color:var(--accent);background:var(--accent-glow)}

/* 搜索 */
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
.search-wrap input{width:100%;height:44px;padding:0 40px 0 42px;border:1px solid var(--border);border-radius:10px;background:var(--bg2);color:var(--text);font-size:14px;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.search-wrap .clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;display:none;font-size:18px;line-height:1}

/* 筛选条 */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:12px}
.f-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.f-label{font-size:13px;color:var(--text3);margin-right:2px;display:inline-flex;align-items:center;gap:4px}
.f-label svg{width:15px;height:15px}
.f-divider{width:1px;height:22px;background:var(--border);margin:0 8px;display:none}
@media(min-width:900px){.f-divider{display:block}}
.chip{padding:5px 13px;border:1px solid var(--border);border-radius:999px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;transition:.18s;line-height:1.4}
.chip:hover{color:var(--text);border-color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px var(--accent-glow)}
.chip.cat-ai{border-color:rgba(168,85,247,.4);color:#d8b4fe}
.chip.cat-ai:hover,.chip.cat-ai.active{background:var(--ai);border-color:var(--ai);color:#fff}
.chip.cat-cloud{border-color:rgba(56,189,248,.4);color:#7dd3fc}
.chip.cat-cloud:hover,.chip.cat-cloud.active{background:var(--cloud);border-color:var(--cloud);color:#0b1220}
.chip.cat-dev{border-color:rgba(52,211,153,.4);color:#6ee7b7}
.chip.cat-dev:hover,.chip.cat-dev.active{background:var(--dev);border-color:var(--dev);color:#04150e}
.chip.cat-hw{border-color:rgba(251,146,60,.4);color:#fdba74}
.chip.cat-hw:hover,.chip.cat-hw.active{background:var(--hw);border-color:var(--hw);color:#1a0f04}
.btn-clear{margin-left:auto;padding:5px 12px;border:none;background:none;color:var(--text3);font-size:13px;cursor:pointer;display:none}
.btn-clear:hover{color:var(--text)}

/* 主区 */
.main{max-width:1200px;margin:0 auto;padding:20px}
.count{font-size:14px;color:var(--text3);margin-bottom:16px}
.count b{color:var(--text)}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:.22s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);background:var(--card-hover);border-color:rgba(59,130,246,.45);box-shadow:var(--shadow-hover)}
.card.ended{opacity:.5}
.card .status{position:absolute;top:16px;right:16px;font-size:12px;padding:3px 11px;border-radius:999px;font-weight:500}
.status.ok{color:var(--ok);background:var(--ok-bg)}
.status.soon{color:var(--soon);background:var(--soon-bg)}
.status.end{color:var(--end);background:var(--end-bg)}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;padding-right:80px}
.tag{font-size:12px;padding:2px 9px;border-radius:6px;font-weight:500}
.tag-ai{color:var(--ai);background:var(--ai-bg)}
.tag-cloud{color:var(--cloud);background:var(--cloud-bg)}
.tag-dev{color:var(--dev);background:var(--dev-bg)}
.tag-hw{color:var(--hw);background:var(--hw-bg)}
.tag-misc{color:var(--misc);background:var(--misc-bg)}
.tag-tier-顶会{color:#fda4af;background:rgba(225,29,72,.15)}
.tag-tier-重要{color:#fcd34d;background:rgba(245,158,11,.15)}
.tag-tier-一般{color:#cbd5e1;background:rgba(100,116,139,.15)}
.card h2{font-size:17px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:4px}
.card .theme{font-size:13px;color:var(--accent);margin-bottom:8px}
.card .desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--text2);margin-bottom:16px}
.card .meta .row{display:flex;align-items:center;gap:8px;overflow:hidden}
.card .meta .row svg{width:15px;height:15px;flex-shrink:0;color:var(--accent);opacity:.7}
.card .meta .row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{font-size:12px;color:var(--text3);margin-left:auto}
.card .btn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:9px;font-size:14px;font-weight:500;transition:.2s}
.card .btn.go{background:var(--accent);color:#fff}
.card .btn.go:hover{background:#2563eb;box-shadow:0 4px 14px var(--accent-glow)}
.card .btn.go svg{width:16px;height:16px;transition:.2s}
.card .btn.go:hover svg{transform:translateX(3px)}
.card .btn.off{background:var(--bg2);color:var(--text3);cursor:not-allowed}

/* 空状态/加载/错误 */
.state{text-align:center;padding:60px 20px;color:var(--text3)}
.state svg{width:56px;height:56px;margin:0 auto 16px;opacity:.3}
.state h3{font-size:18px;color:var(--text);margin-bottom:8px}
.state p{font-size:14px;margin-bottom:20px}
.state .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-size:14px;cursor:pointer}
.state .btn:hover{border-color:var(--accent);color:var(--text)}
.skeleton{height:260px;background:linear-gradient(110deg,var(--bg2) 8%,var(--card) 18%,var(--bg2) 33%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius)}
@keyframes shimmer{to{background-position-x:-200%}}

/* 页脚 */
.footer{border-top:1px solid var(--border);text-align:center;padding:18px;font-size:13px;color:var(--text3);margin-top:20px}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="top-row">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div>
          <h1>技术峰会追踪</h1>
          <div class="sub" id="subtitle">数据加载中...</div>
        </div>
      </div>
      <button class="btn-refresh" onclick="loadData()" id="btnRefresh">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="搜索峰会名称、城市、主题、简介、主办方..." oninput="onInput(this.value)">
      <button class="clear" onclick="clearSearch()">✕</button>
    </div>
    <div class="filters" id="filters"><!-- 动态生成筛选栏 --></div>
  </div>
</div>
<div class="main">
  <div class="count" id="count"></div>
  <div id="content"><!-- 卡片/加载/错误 --></div>
</div>
<div class="footer">数据来源于公开信息，仅供参考 · 本站由静态页面自动生成，数据每3天自动更新</div>

<script>
// ===== 数据与状态 =====
const DATA_URL = './data/summits.json';
let allSummits = [];
let months = [], cities = [];
const CATS = ['AI','云','开发者','硬件·芯片','综合'];
const CAT_CLS = {'AI':'cat-ai','云':'cat-cloud','开发者':'cat-dev','硬件·芯片':'cat-hw','综合':'cat-misc'};
const state = { q:'', month:null, city:null, cat:null, st:null };

// ===== 工具 =====
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc = s => s.replaceAll(';','&#59;');

function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function deriveStatus(s){
  const up=s.status;
  if(up==='registering'||up==='upcoming'||up==='ended')return up;
  const today=startOfDay(new Date());
  const st=startOfDay(new Date(s.start_date));
  const en=startOfDay(new Date(s.end_date));
  if(isNaN(st.getTime())||isNaN(en.getTime()))return 'upcoming';
  if(en<today)return 'ended'; if(st>today)return 'upcoming'; return 'registering';
}
function fmtDate(a,b){
  const s=new Date(a),e=new Date(b);
  if(isNaN(s.getTime())||isNaN(e.getTime()))return (a&&b)?`${a} ~ ${b}`:'时间待定';
  const f=d=>`${d.getMonth()+1}月${d.getDate()}日`;
  return (a===b||s.getTime()===e.getTime())?f(s):`${f(s)}-${e.getDate()}日`;
}
function monthOf(d){const dt=new Date(d);return isNaN(dt.getTime())?'时间待定':`${dt.getMonth()+1}月`}

// ===== 筛选栏 =====
function buildFilters(){
  let h=`<div class="f-group"><span class="f-label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>城市</span>`;
  cities.forEach(c=>{
    const a=state.city===c?'active':'';
    h+=`<button class="chip ${a}" data-type="city" data-val="${esc(c)}">${esc(c)}</button>`;
  });
  h+=`</div><span class="f-divider"></span><div class="f-group"><span class="f-label">月份</span>`;
  months.forEach(m=>{
    const a=state.month===m?'active':'';
    h+=`<button class="chip ${a}" data-type="month" data-val="${esc(m)}">${esc(m)}</button>`;
  });
  h+=`</div><span class="f-divider"></span><div class="f-group"><span class="f-label">分类</span>`;
  CATS.forEach(c=>{
    const a=state.cat===c?'active':'';
    const cls=CAT_CLS[c]||'cat-misc';
    h+=`<button class="chip ${cls} ${a}" data-type="cat" data-val="${esc(c)}">${esc(c)}</button>`;
  });
  h+=`</div><span class="f-divider"></span><div class="f-group"><span class="f-label">状态</span>`;
  [['registering','报名中'],['upcoming','即将开始'],['ended','已结束']].forEach(([v,l])=>{
    const a=state.st===v?'active':'';
    h+=`<button class="chip ${a}" data-type="st" data-val="${v}">${l}</button>`;
  });
  h+=`</div><button id="btn-clear" class="btn-clear" onclick="clearFilters()">清除筛选 ✕</button>`;
  $('filters').innerHTML=h;
  $('filters').querySelectorAll('*').forEach(el=>{
    if(el.dataset&&el.dataset.type){
      el.onclick=()=>{toggleFilter(el.dataset.type,el.dataset.val);};
    }
  });
  $('btnRefresh').onclick=loadData;
}
function toggleFilter(type,val){
  const k={city:'city',month:'month',cat:'cat',st:'st'}[type];
  state[k]= (state[k]===val)?null:val;
  buildFilters(); render();
}

// ===== 过滤与渲染 =====
function filtered(){
  const q=state.q.toLowerCase();
  return allSummits.filter(s=>{
    const mq = !q || s.name.toLowerCase().includes(q) || s.city.toLowerCase().includes(q)
      || (s.theme??'').toLowerCase().includes(q) || s.description.toLowerCase().includes(q)
      || (s.organizer??'').toLowerCase().includes(q);
    const mm = state.month==null || monthOf(s.start_date)===state.month;
    const mc = state.city==null || s.city===state.city;
    const mcat = state.cat==null || s.category.includes(state.cat);
    const mst = state.st==null || deriveStatus(s)===state.st;
    return mq&&mm&&mc&&mcat&&mst;
  });
}
function render(){
  const list=filtered();
  $('count').innerHTML=`共找到 <b>${list.length}</b> 场峰会`;
  const cls=$('btn-clear');
  if(state.q||state.month||state.city||state.cat||state.st){cls.style.display='inline-block';}else{cls.style.display='none';}
  if(!list.length){
    $('content').innerHTML=`<div class="state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
      <h3>未找到相关峰会</h3><p>尝试调整搜索条件或清除筛选</p>
      <button class="btn" onclick="clearFilters()">清除全部筛选</button></div>`;
    return;
  }
  $('content').innerHTML = '<div class="grid">'+list.map(cardHTML).join('')+'</div>';
}
function cardHTML(s){
  const st=deriveStatus(s);
  const scls = st==='registering'?'ok':(st==='upcoming'?'soon':'end');
  const stxt = st==='registering'?'报名中':(st==='upcoming'?'即将开始':'已结束');
  let tg='';
  (s.category||[]).forEach(c=>{ tg+=`<span class="tag tag-${CAT_CLS[c]||'tag-misc'}">${esc(c)}</span>`; });
  let tier='';
  if(s.tier){tier=`<span class="tag tier tier-${esc(s.tier)}">${esc(s.tier)}</span>`;}
  let priceArr='';
  if(s.pricing){
    const pc=s.pricing==='免费'?{c:'var(--ok)',b:'rgba(52,211,153,.15)'}:{c:'var(--hw)',b:'rgba(251,146,60,.15)'};
    priceArr=`<span class="price" style="color:${pc.c};background:${pc.b};padding:1px 8px;border-radius:5px">${esc(s.pricing)}</span>`;
  }
  const theme = s.theme?`<div class="theme">${esc(s.theme)}</div>`:'';
  const desc = s.description?`<div class="desc">${esc(s.description)}</div>`:'';
  const venueTxt = s.venue && s.venue!==s.city ? ` · ${esc(s.venue)}` : '';
  const org = s.organizer?`<div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/><path d="M9 7h2M9 11h2M9 15h2M14 7h1M14 11h1M14 15h1"/></svg><span title="${esc(s.organizer)}">${esc(s.organizer)}</span></div>`:'';
  const btn = st==='ended'
    ? `<div class="btn off">已结束</div>`
    : `<a class="btn go" href="${esc(s.register_url)}" target="_blank" rel="noopener noreferrer">立即报名
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`;
  return `<div class="card ${st==='ended'?'ended':''}">
    <span class="status ${scls}">${stxt}</span>
    <div class="tags">${tg}${tier}${priceArr}</div>
    <h2>${esc(s.name)}</h2>${theme}${desc}
    <div class="meta">
      <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>${fmtDate(s.start_date,s.end_date)}</span></div>
      <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span>${esc(s.city)}${venueTxt}</span></div>
      ${org}
    </div>
    ${btn}
  </div>`;
}

// ===== 搜索 =====
function onInput(v){
  state.q=v.trim();
  
  document.querySelector('.search-wrap .clear').style.display = v?'block':'none';
  render();
}
function clearSearch(){ const i=$('search'); i.value=''; state.q=''; document.querySelector('.search-wrap .clear').style.display='none'; render(); }

// ===== 筛选 =====
function clearFilters(){
  state.q=''; state.month=null; state.city=null; state.cat=null; state.st=null;
  $('search').value='';
  document.querySelector('.search-wrap .clear').style.display='none';
  buildFilters(); render();
}

// ===== 加载数据 =====
async function loadData(){
  const btn=$('btnRefresh');
  btn.innerHTML='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg> 更新中...';
  $('content').innerHTML=`<div class="state"><h3>正在加载峰会数据...</h3></div>`;
  try{
    const res=await fetch(DATA_URL+'?t='+Date.now());
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    allSummits=data.summits||[];
    rebuildIndex();
    render();
    const ver=data.scoring_version?(' · v'+esc(data.scoring_version)):'';
    $('subtitle').textContent='数据更新于 '+(data.last_updated||'未知')+ver;
  }catch(e){
    console.error(e);
    $('content').innerHTML=`<div class="state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <h3>数据加载失败</h3><p>无法获取峰会数据，请检查网络后重试</p>
      <button class="btn" onclick="loadData()">重新加载</button></div>`;
    $('subtitle').textContent='数据加载失败，请重试';
  }finally{
    btn.innerHTML='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg> 刷新';
  }
}
function rebuildIndex(){
  months=[];
  cities=[];
  const ms=new Set(),cs=new Set();
  allSummits.forEach(s=>{ms.add(monthOf(s.start_date));cs.add(s.city);});
  months=[...ms].sort((a,b)=> a==='时间待定'?1:(b==='时间待定'?-1:(parseInt(a)-parseInt(b))));
  cities=[...cs].sort();
  buildFilters();
}

loadData();
</script>
