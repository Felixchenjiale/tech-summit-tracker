<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术峰会追踪 · 原型 v3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;
  --card:#ffffff;
  --border:#e2e8f0;
  --accent:#2563eb;
  --accent2:#7c3aed;
  --text:#1e293b;
  --text-secondary:#475569;
  --muted:#94a3b8;
  --gold:#F5B301;
  --gold-soft:#FFE9A8;
  --free:#059669;
  --free-soft:#d1fae5;
  --paid:#b91c1c;
  --paid-soft:#fee2e2;
  --tag-ai-bg:#dbeafe;--tag-ai-text:#1d4ed8;
  --tag-cloud-bg:#ede9fe;--tag-cloud-text:#6d28d9;
  --tag-dev-bg:#d1fae5;--tag-dev-text:#047857;
  --tag-hw-bg:#fef3c7;--tag-hw-text:#b45309;
  --tag-misc-bg:#e0e7ff;--tag-misc-text:#4338ca;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-hover:0 10px 25px rgba(37,99,235,.1),0 4px 10px rgba(0,0,0,.06);
  --shadow-gold:0 4px 14px rgba(245,179,1,.18),0 1px 3px rgba(0,0,0,.06);
  --radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif;line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* Header */
.header{padding:2rem 1.5rem 1.2rem;text-align:center;background:linear-gradient(135deg,#1e3a5f 0%,#2d1b69 100%);color:#fff;position:relative}
.header h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.3rem;color:#fff}
.header .subtitle{color:rgba(255,255,255,.7);font-size:.88rem;font-weight:400}
.proto-badge{position:absolute;top:.75rem;right:1rem;background:rgba(255,209,102,.18);color:#FFD166;padding:.2rem .55rem;border-radius:6px;font-size:.7rem;font-weight:700;letter-spacing:.03em;border:1px solid rgba(255,209,102,.35)}

/* 轮播区 */
.carousel-section{max-width:1200px;margin:1.2rem auto 0;padding:0 1.5rem}
.carousel-title{display:flex;align-items:center;gap:.45rem;margin-bottom:.45rem;color:var(--text)}
.carousel-title .icon{font-size:1rem}
.carousel-title h2{font-size:.95rem;font-weight:700;letter-spacing:.02em}
.carousel-title .sub{color:var(--muted);font-size:.72rem;margin-left:.25rem}

.carousel{position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(135deg,#FFFDF5 0%,#FFF8DC 60%,#FFEFB0 100%);border:1.5px solid var(--gold);box-shadow:0 4px 14px rgba(245,179,1,.18)}
.carousel-track{display:flex;transition:transform .5s cubic-bezier(.4,.2,.2,1);will-change:transform}
.carousel-slide{flex:0 0 100%;padding:.9rem 1.4rem 1rem;display:flex;flex-direction:column;gap:.35rem;min-height:0;box-sizing:border-box}
.slide-tags{display:flex;flex-wrap:wrap;gap:.28rem;align-items:center}
.slide-name{font-size:1.1rem;font-weight:800;color:#8B6508;line-height:1.35;letter-spacing:-.01em}
.slide-theme{font-size:.8rem;color:var(--accent);font-weight:600;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.slide-desc{display:none}
.slide-meta{display:flex;flex-wrap:wrap;gap:.6rem;font-size:.76rem;color:var(--text-secondary);margin-top:.1rem}
.slide-meta span{display:flex;align-items:center;gap:.2rem}
.slide-actions{margin-top:.35rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.slide-score{font-size:.72rem;color:#8B6508;font-weight:600;background:rgba(255,255,255,.6);padding:.18rem .5rem;border-radius:5px;border:1px solid rgba(245,179,1,.35)}
.slide-btn{background:linear-gradient(135deg,#F5B301,#E8A200);color:#fff;padding:.38rem 1.1rem;border-radius:7px;font-size:.82rem;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(245,179,1,.3);transition:all .15s;display:inline-flex;align-items:center;gap:.3rem;margin-left:auto}
.slide-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,179,1,.4)}

/* 轮播控件 */
.carousel-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.95rem;color:#8B6508;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:all .15s;display:flex;align-items:center;justify-content:center;z-index:5}
.carousel-nav:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.carousel-nav.prev{left:.5rem}
.carousel-nav.next{right:.5rem}
.carousel-dots{display:flex;justify-content:center;gap:.3rem;padding:.35rem 0 .5rem;background:rgba(255,255,255,.4)}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(139,101,8,.3);border:none;cursor:pointer;transition:all .2s;padding:0}
.dot.active{background:#8B6508;transform:scale(1.4)}

/* 筛选区 */
.filters{padding:.8rem 1.5rem;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;margin-top:2rem}
.filter-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem;max-width:1400px;margin-left:auto;margin-right:auto}
.filter-row:last-child{margin-bottom:0}
.filter-row label{color:var(--muted);font-size:.75rem;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0;min-width:2.5rem}
.filter-scroll{display:flex;gap:.35rem;overflow-x:auto;flex:1;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent;-webkit-overflow-scrolling:touch}
.filter-scroll::-webkit-scrollbar{height:3px}
.filter-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.filter-btn{background:#f1f5f9;border:1px solid transparent;color:var(--text-secondary);padding:.28rem .7rem;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap;flex-shrink:0}
.filter-btn:hover{background:#e2e8f0;color:var(--text)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggle-tier{display:inline-flex;align-items:center;gap:.35rem;background:#f1f5f9;border:1px solid transparent;color:var(--text-secondary);padding:.28rem .7rem;border-radius:8px;font-size:.8rem;cursor:pointer;font-weight:500;white-space:nowrap;flex-shrink:0;transition:all .15s;user-select:none}
.toggle-tier:hover{background:#e2e8f0;color:var(--text)}
.toggle-tier.active{background:linear-gradient(135deg,#F5B301,#E8A200);color:#fff;border-color:transparent;box-shadow:0 2px 6px rgba(245,179,1,.35)}
.sort-select{background:#f1f5f9;border:1px solid transparent;color:var(--text-secondary);padding:.28rem .7rem;border-radius:8px;font-size:.8rem;cursor:pointer;font-weight:500;white-space:nowrap;flex-shrink:0}
.clear-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.28rem .7rem;border-radius:8px;font-size:.78rem;cursor:pointer;font-weight:500;flex-shrink:0;margin-left:auto}
.clear-btn:hover{color:var(--text);border-color:var(--accent)}

/* 分区标题 */
.section-title{display:flex;align-items:center;gap:.65rem;padding:1.2rem 1.5rem .6rem;max-width:1400px;margin:0 auto}
.section-title .badge{padding:.28rem .75rem;border-radius:8px;font-size:.88rem;font-weight:800;letter-spacing:.02em}
.section-title .badge.free{background:var(--free-soft);color:var(--free);border:1px solid #a7f3d0}
.section-title .badge.paid{background:var(--paid-soft);color:var(--paid);border:1px solid #fecaca}
.section-title .desc{color:var(--muted);font-size:.82rem;font-weight:500}
.section-title .count{color:var(--text-secondary);font-size:.82rem;font-weight:600;margin-left:auto}

/* 分区容器 */
.section{padding:0 0 1rem}
.section.free-section{background:linear-gradient(180deg,rgba(209,250,229,.35) 0%,transparent 100%)}
.section-divider{max-width:1400px;margin:1rem auto;padding:0 1.5rem}
.section-divider hr{border:none;border-top:1px dashed var(--border)}

.grid{padding:0 1.5rem 1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1rem;max-width:1400px;margin:0 auto}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.3rem;transition:all .2s;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:#cbd5e1}
.card.ended{opacity:.5}
.card.ended:hover{opacity:.65}
.card.tier-top{border:2px solid var(--gold);box-shadow:var(--shadow-gold);background:linear-gradient(180deg,#FFFDF5 0%,#ffffff 45%)}
.card.tier-top:hover{border-color:var(--gold);box-shadow:0 10px 24px rgba(245,179,1,.28),0 4px 10px rgba(0,0,0,.06)}

.card .tags{display:flex;flex-wrap:wrap;gap:.3rem;min-height:1.5rem;margin-bottom:.5rem;align-items:center}
.tag{padding:.18rem .55rem;border-radius:6px;font-size:.72rem;font-weight:600;letter-spacing:.01em}
.tag-ai{background:var(--tag-ai-bg);color:var(--tag-ai-text)}
.tag-cloud{background:var(--tag-cloud-bg);color:var(--tag-cloud-text)}
.tag-dev{background:var(--tag-dev-bg);color:var(--tag-dev-text)}
.tag-hw{background:var(--tag-hw-bg);color:var(--tag-hw-text)}
.tag-misc{background:var(--tag-misc-bg);color:var(--tag-misc-text)}
.tag-free{background:#d1fae5;color:#047857}
.tag-paid{background:#fee2e2;color:#b91c1c}

.stars{display:inline-flex;align-items:center;gap:.15rem;font-size:.78rem;font-weight:700;padding:.16rem .5rem;border-radius:6px;margin-left:auto;white-space:nowrap;cursor:help}
.stars.top{background:linear-gradient(135deg,#FFF3C4,#FFE082);color:#8B6508;box-shadow:inset 0 0 0 1px rgba(245,179,1,.35)}
.stars.mid{background:#F1F5F9;color:#475569}
.stars.low{background:#F1F5F9;color:#94A3B8}
.stars .user-mark{margin-left:.15rem;font-size:.72rem;color:#2563eb;font-weight:700}

.card .name{font-size:1.05rem;font-weight:700;margin-bottom:.3rem;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.5rem;max-height:3rem}
.card .theme{color:var(--accent);font-size:.84rem;font-weight:600;margin-bottom:.35rem;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .desc{color:var(--text-secondary);font-size:.82rem;margin-bottom:.6rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.6;min-height:1.6rem;max-height:3.2rem}
.card .meta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.8rem;color:var(--text-secondary);margin-bottom:.75rem;align-items:center}
.card .meta span{display:flex;align-items:center;gap:.2rem}
.card .actions{display:flex;gap:.5rem;margin-top:auto;padding-top:.35rem}
.btn-register{display:inline-flex;align-items:center;gap:.35rem;background:var(--accent);color:#fff;padding:.5rem 1.15rem;border-radius:8px;font-size:.84rem;font-weight:600;text-decoration:none;transition:all .15s;border:none;cursor:pointer}
.btn-register:hover{background:#1d4ed8;transform:scale(1.02)}
.btn-register.disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed;pointer-events:none}

.empty{text-align:center;padding:2rem;color:var(--muted);grid-column:1/-1}
.footer{text-align:center;padding:2rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--border);margin-top:1rem}
.footer a{color:var(--accent);text-decoration:none;font-weight:500}
.loading{text-align:center;padding:4rem 2rem;color:var(--muted)}
.loading .spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .grid{grid-template-columns:1fr;padding:0 1rem 1rem}
  .header h1{font-size:1.35rem}
  .filters{padding:.6rem .75rem}
  .card{padding:1rem 1.1rem}
  .stars{font-size:.72rem;padding:.14rem .4rem}
  .carousel-section{padding:0 1rem;margin-top:.8rem}
  .carousel-slide{padding:.8rem 1rem .9rem;min-height:0}
  .slide-name{font-size:1rem}
  .slide-meta{font-size:.72rem;gap:.4rem}
  .slide-btn{padding:.35rem .9rem;font-size:.78rem}
  .carousel-nav{width:24px;height:24px;font-size:.85rem}
  .section-title{padding:1rem 1rem .5rem}
}
</style>
</head>
<body>

<div class="header">
  <div class="proto-badge">🧪 原型预览版</div>
  <h1>技术峰会追踪</h1>
  <div class="subtitle" id="subtitle">加载数据中...</div>
</div>

<!-- 轮播区 -->
<div class="carousel-section" id="carousel-section" style="display:none">
  <div class="carousel-title">
    <span class="icon">💎</span>
    <h2>重点付费峰会</h2>
    <span class="sub">🌟🌟🌟 顶会档 · 建议重点关注</span>
  </div>
  <div class="carousel">
    <div class="carousel-track" id="carousel-track"></div>
    <button class="carousel-nav prev" id="prev-btn" aria-label="上一个">‹</button>
    <button class="carousel-nav next" id="next-btn" aria-label="下一个">›</button>
    <div class="carousel-dots" id="carousel-dots"></div>
  </div>
</div>

<!-- 筛选区 -->
<div class="filters" id="filters">
  <div class="filter-row">
    <label>月份</label>
    <div class="filter-scroll" id="month-filters"></div>
  </div>
  <div class="filter-row">
    <label>城市</label>
    <div class="filter-scroll" id="city-filters"></div>
  </div>
  <div class="filter-row">
    <label>分类</label>
    <div class="filter-scroll" id="cat-filters"></div>
  </div>
  <div class="filter-row">
    <label>视图</label>
    <div class="filter-scroll" id="view-controls">
      <button class="toggle-tier" id="toggle-top" title="只显示评分≥4.0 的顶级峰会">🌟 只看顶会</button>
      <select class="sort-select" id="sort-select" title="排序方式">
        <option value="date-asc">📅 按日期升序</option>
        <option value="weight-desc">⭐ 按权重降序</option>
      </select>
    </div>
    <button class="clear-btn" onclick="clearFilters()">清除筛选</button>
  </div>
</div>

<!-- 免费区块 -->
<div class="section free-section">
  <div class="section-title">
    <span class="badge free">🆓 免费展会</span>
    <span class="desc">政府/部委/行业协会主导 · 政策与产业趋势</span>
    <span class="count" id="free-count"></span>
  </div>
  <div class="grid" id="free-grid"></div>
</div>

<div class="section-divider"><hr></div>

<!-- 付费区块 -->
<div class="section paid-section">
  <div class="section-title">
    <span class="badge paid">💰 付费展会</span>
    <span class="desc">商业主导 · 技术深度与工程实践</span>
    <span class="count" id="paid-count"></span>
  </div>
  <div class="grid" id="paid-grid"></div>
</div>

<div class="footer">
  🧪 原型预览版 · <a href="./index.html">← 返回正式版</a> · <a href="https://github.com/Felixchenjiale/tech-summit-tracker">GitHub</a>
</div>

<script>
const DATA_URL = './data/summits.json';
const TAG_MAP = {'AI':'tag-ai','云':'tag-cloud','开发者':'tag-dev','综合':'tag-misc'};

let allSummits = [];
let activeFilters = {month:null, city:null, category:null};
let onlyTop = false;
let sortMode = 'date-asc';

let carouselItems = [];
let carouselIdx = 0;
let carouselTimer = null;

async function loadData(){
  try{
    const res = await fetch(DATA_URL+'?t='+Date.now());
    const data = await res.json();
    allSummits = data.summits || [];
    const ver = data.scoring_version ? ' · 打分 '+data.scoring_version : '';
    document.getElementById('subtitle').textContent = '数据更新于 '+(data.last_updated||'未知')+ver+' · 每3天自动更新';
    buildCarousel();
    buildFilters();
    bindViewControls();
    render();
  }catch(e){
    document.getElementById('free-grid').innerHTML = '<div class="empty">数据加载失败：'+e.message+'</div>';
  }
}

function getMonth(d){return d?d.slice(0,7):''}
function getMonthLabel(m){if(!m)return '';const[y,mm]=m.split('-');return y+'年'+parseInt(mm)+'月'}
function isEnded(s){
  if(s.status==='ended')return true;
  if(s.end_date){const end=new Date(s.end_date+'T23:59:59');return end<new Date()}
  return false;
}
function effectiveScore(s){
  if(typeof s.user_rating==='number'&&!isNaN(s.user_rating))return s.user_rating;
  if(typeof s.weight_score==='number'&&!isNaN(s.weight_score))return s.weight_score;
  return 0;
}
function renderStars(s){
  const hasUser=typeof s.user_rating==='number'&&!isNaN(s.user_rating);
  let tier=s.tier;
  if(hasUser){const r=s.user_rating;tier=r>=4.0?'顶会':(r>=3.0?'重要':'一般')}
  if(!tier)return '';
  let stars,cls,label;
  if(tier==='顶会'){stars='🌟🌟🌟';cls='top';label='顶会'}
  else if(tier==='重要'){stars='🌟🌟';cls='mid';label='重要'}
  else{stars='🌟';cls='low';label='一般'}
  const scoreVal=hasUser?s.user_rating:s.weight_score;
  const scoreTxt=(typeof scoreVal==='number')?scoreVal.toFixed(2):'';
  const orgs=s.organizer_score,sc=s.scale,inf=s.influence;
  const detail=(orgs!=null&&sc!=null&&inf!=null)?`${label} · 综合 ${scoreTxt}\n主办 ${orgs}·规模 ${sc}·影响力 ${inf}`+(hasUser?'\n（用户手动打分）':''):`${label} · ${scoreTxt}`;
  return `<span class="stars ${cls}" title="${detail}">${stars}${hasUser?'<span class="user-mark">✏️</span>':''}</span>`;
}

/* ---------- 轮播 ---------- */
function buildCarousel(){
  // 付费 + 顶会（tier===顶会）+ 未结束优先
  const paidTop = allSummits.filter(s => s.pricing==='付费' && s.tier==='顶会');
  const now = new Date();
  paidTop.sort((a,b)=>{
    const ae=isEnded(a),be=isEnded(b);
    if(ae!==be)return ae?1:-1;
    // 未结束的按日期升序（近的在前）
    const ad=a.start_date||'9999-99-99',bd=b.start_date||'9999-99-99';
    return ad.localeCompare(bd);
  });
  carouselItems = paidTop;
  if(!carouselItems.length){
    document.getElementById('carousel-section').style.display='none';
    return;
  }
  document.getElementById('carousel-section').style.display='block';
  const track=document.getElementById('carousel-track');
  const dots=document.getElementById('carousel-dots');
  track.innerHTML = carouselItems.map(s=>{
    const catArr=Array.isArray(s.category)?s.category:(s.category?[s.category]:[]);
    const tags=catArr.map(c=>`<span class="tag ${TAG_MAP[c]||'tag-misc'}">${c}</span>`).join('');
    const dateRange=(s.start_date||'待定')+(s.end_date&&s.end_date!==s.start_date?' ~ '+s.end_date:'');
    const score=effectiveScore(s).toFixed(2);
    const stars=renderStars(s);
    const regBtn=s.register_url?`<a href="${s.register_url}" target="_blank" rel="noopener" class="slide-btn">🔗 去报名</a>`:'<span class="slide-btn" style="opacity:.5;pointer-events:none">暂无链接</span>';
    return `<div class="carousel-slide">
      <div class="slide-tags">${tags}<span class="tag tag-paid">💰 付费</span>${stars}</div>
      <div class="slide-name">${s.name||''}</div>
      ${s.theme?`<div class="slide-theme">${s.theme}</div>`:''}
      ${s.description?`<div class="slide-desc">${s.description}</div>`:''}
      <div class="slide-meta">
        <span>📅 ${dateRange}</span>
        ${s.city?`<span>📍 ${s.city}${s.venue?' · '+s.venue:''}</span>`:''}
        ${s.organizer?`<span>🏢 ${s.organizer}</span>`:''}
      </div>
      <div class="slide-actions">
        <span class="slide-score">综合 ${score} · 主办 ${s.organizer_score||'-'}·规模 ${s.scale||'-'}·影响力 ${s.influence||'-'}</span>
        ${regBtn}
      </div>
    </div>`;
  }).join('');
  dots.innerHTML = carouselItems.map((_,i)=>`<button class="dot${i===0?' active':''}" data-i="${i}" aria-label="第 ${i+1} 张"></button>`).join('');
  dots.querySelectorAll('.dot').forEach(btn=>{
    btn.addEventListener('click',()=>{gotoSlide(parseInt(btn.dataset.i));restartTimer()});
  });
  document.getElementById('prev-btn').addEventListener('click',()=>{gotoSlide(carouselIdx-1);restartTimer()});
  document.getElementById('next-btn').addEventListener('click',()=>{gotoSlide(carouselIdx+1);restartTimer()});
  const carousel=document.querySelector('.carousel');
  carousel.addEventListener('mouseenter',()=>clearInterval(carouselTimer));
  carousel.addEventListener('mouseleave',()=>startTimer());
  startTimer();
}
function gotoSlide(i){
  const n=carouselItems.length;
  carouselIdx=(i+n)%n;
  document.getElementById('carousel-track').style.transform=`translateX(-${carouselIdx*100}%)`;
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active',idx===carouselIdx));
}
function startTimer(){
  clearInterval(carouselTimer);
  carouselTimer=setInterval(()=>gotoSlide(carouselIdx+1),5000);
}
function restartTimer(){startTimer()}

/* ---------- 筛选 ---------- */
function buildFilters(){
  const months=[...new Set(allSummits.map(s=>getMonth(s.start_date)).filter(Boolean))].sort();
  const cities=[...new Set(allSummits.map(s=>s.city).filter(Boolean))].sort();
  const cats=['AI','云','开发者','综合'];
  document.getElementById('month-filters').innerHTML=months.map(m=>`<button class="filter-btn" data-type="month" data-val="${m}">${getMonthLabel(m)}</button>`).join('');
  document.getElementById('city-filters').innerHTML=cities.map(c=>`<button class="filter-btn" data-type="city" data-val="${c}">${c}</button>`).join('');
  document.getElementById('cat-filters').innerHTML=cats.map(c=>`<button class="filter-btn" data-type="category" data-val="${c}">${c}</button>`).join('');
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const t=btn.dataset.type,v=btn.dataset.val;
      if(activeFilters[t]===v)activeFilters[t]=null;else activeFilters[t]=v;
      syncFilterUI();render();
    });
  });
}
function bindViewControls(){
  const tb=document.getElementById('toggle-top');
  tb.addEventListener('click',()=>{onlyTop=!onlyTop;tb.classList.toggle('active',onlyTop);render();});
  const ss=document.getElementById('sort-select');
  ss.value=sortMode;
  ss.addEventListener('change',()=>{sortMode=ss.value;render();});
}
function syncFilterUI(){
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.classList.toggle('active',activeFilters[btn.dataset.type]===btn.dataset.val);
  });
}
function clearFilters(){
  activeFilters={month:null,city:null,category:null};
  onlyTop=false;sortMode='date-asc';
  document.getElementById('toggle-top').classList.remove('active');
  document.getElementById('sort-select').value='date-asc';
  syncFilterUI();render();
}

function passFilter(s){
  if(activeFilters.month && getMonth(s.start_date)!==activeFilters.month)return false;
  if(activeFilters.city && s.city!==activeFilters.city)return false;
  if(activeFilters.category){
    const catArr=Array.isArray(s.category)?s.category:(s.category?[s.category]:[]);
    if(!catArr.includes(activeFilters.category))return false;
  }
  if(onlyTop){
    const hasUser=typeof s.user_rating==='number'&&!isNaN(s.user_rating);
    if(hasUser){if(s.user_rating<4.0)return false;}
    else if(s.tier!=='顶会')return false;
  }
  return true;
}

function sortList(list){
  const arr=list.slice();
  if(sortMode==='weight-desc'){
    arr.sort((a,b)=>{
      const ae=isEnded(a),be=isEnded(b);
      if(ae!==be)return ae?1:-1;
      const sb=effectiveScore(b),sa=effectiveScore(a);
      if(sb!==sa)return sb-sa;
      return (a.start_date||'9999').localeCompare(b.start_date||'9999');
    });
  }else{
    arr.sort((a,b)=>{
      const ae=isEnded(a),be=isEnded(b);
      if(ae!==be)return ae?1:-1;
      return (a.start_date||'9999').localeCompare(b.start_date||'9999');
    });
  }
  return arr;
}

function renderCard(s){
  const ended=isEnded(s);
  const dateRange=(s.start_date||'待定')+(s.end_date&&s.end_date!==s.start_date?' ~ '+s.end_date:'');
  const catArr=Array.isArray(s.category)?s.category:(s.category?[s.category]:[]);
  const tags=catArr.map(c=>`<span class="tag ${TAG_MAP[c]||'tag-misc'}">${c}</span>`).join('');
  const pricingTag=s.pricing==='付费'?'<span class="tag tag-paid">💰 付费</span>':'<span class="tag tag-free">🆓 免费</span>';
  const starsHtml=renderStars(s);
  const regBtn=s.register_url?`<a href="${s.register_url}" target="_blank" rel="noopener" class="btn-register${ended?' disabled':''}">🔗 ${ended?'已结束':'去报名'}</a>`:'<span class="btn-register disabled">暂无链接</span>';
  const topClass=(s.tier==='顶会')?' tier-top':'';
  return `<div class="card${ended?' ended':''}${topClass}">
    <div class="tags">${tags}${pricingTag}${starsHtml}</div>
    <div class="name">${s.name||''}</div>
    ${s.theme?`<div class="theme">${s.theme}</div>`:''}
    ${s.description?`<div class="desc">${s.description}</div>`:'<div class="desc" style="visibility:hidden">-</div>'}
    <div class="meta">
      <span>📅 ${dateRange}</span>
      ${s.city?`<span>📍 ${s.city}${s.venue?' · '+s.venue:''}</span>`:''}
      ${s.organizer?`<span>🏢 ${s.organizer}</span>`:''}
    </div>
    <div class="actions">${regBtn}</div>
  </div>`;
}

function render(){
  const filtered=allSummits.filter(passFilter);
  const free=sortList(filtered.filter(s=>s.pricing!=='付费'));
  const paid=sortList(filtered.filter(s=>s.pricing==='付费'));
  const totalFree=allSummits.filter(s=>s.pricing!=='付费').length;
  const totalPaid=allSummits.filter(s=>s.pricing==='付费').length;
  document.getElementById('free-count').textContent=`${free.length} / ${totalFree}`;
  document.getElementById('paid-count').textContent=`${paid.length} / ${totalPaid}`;
  const fg=document.getElementById('free-grid');
  const pg=document.getElementById('paid-grid');
  fg.innerHTML=free.length?free.map(renderCard).join(''):'<div class="empty">当前筛选下无免费展会</div>';
  pg.innerHTML=paid.length?paid.map(renderCard).join(''):'<div class="empty">当前筛选下无付费展会</div>';
}

loadData();
</script>
</body>
